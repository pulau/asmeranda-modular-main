[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asmeranda-ai"
version = "0.1.0"
description = "Machine Learning Platform - Modular"
requires-python = ">=3.9"

# ─────────────────────────────────────────────────────────
# Black Configuration (Code Formatter)
# ─────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
    /(
        \.git
      | \.venv
      | venv
      | build
      | dist
      | htmlcov
      | \.eggs
      | node_modules
      | __pycache__
    )/
'''

# ─────────────────────────────────────────────────────────
# isort Configuration (Import Sorter)
# ─────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3  # Vertical Hanging Indent
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".git", ".venv", "venv", "__pycache__", "node_modules", "htmlcov"]
known_first_party = ["backend", "core", "ml_engine", "modules"]
known_third_party = [
    "fastapi",
    "pydantic",
    "polars",
    "pandas",
    "numpy",
    "sklearn",
    "shap",
    "lime",
    "xgboost",
    "lightgbm",
    "catboost",
]

# ─────────────────────────────────────────────────────────
# Flake8 Configuration (Linting)
# ─────────────────────────────────────────────────────────
[tool.flake8]
max-line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    "node_modules",
]
ignore = [
    "E203",  # Whitespace before ':'
    "W503",  # Line break before binary operator
    "E501",  # Line too long (handled by Black)
]
per-file-ignores = [
    "__init__.py:F401",  # Imported but unused
]

# ─────────────────────────────────────────────────────────
# MyPy Configuration (Type Checking)
# ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for legacy code
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
namespace_packages = true
follow_imports = "normal"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Per-file options
[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "sklearn.*",
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "shap.*",
    "lime.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────
# Coverage Configuration
# ─────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["backend"]
branch = true
parallel = true
omit = [
    "*/migrations/*",
    "*/__init__.py",
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if sys.version_info",
]
precision = 2
skip_covered = false
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# ─────────────────────────────────────────────────────────
# Pytest Configuration (in pyproject.toml, overrides pytest.ini)
# ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "--cov=backend --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "performance: Performance tests",
    "slow: Slow tests",
]

# ─────────────────────────────────────────────────────────
# Pylint Configuration (Advanced Linting)
# ─────────────────────────────────────────────────────────
[tool.pylint.messages_control]
disable = [
    "C0330",  # Wrong hanging indentation before block
    "C0326",  # Bad whitespace around operator
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
    "C0103",  # Invalid name (snake_case)
    "W0212",  # Protected access
    "E1101",  # No member for type
    "W0613",  # Unused argument
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-locals = 15
max-statements = 50
