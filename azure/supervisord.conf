; Asmeranda supervisord - orchestrate uvicorn (backend) + next start (frontend)
[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=/usr/local/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/backend.log
stderr_logfile=/app/logs/backend.err.log
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1",ASMERANDA_HOST="0.0.0.0",ASMERANDA_PORT="8000",ASMERANDA_DATA_DIR="/app/data",ASMERANDA_LOG_LEVEL="INFO"

[program:frontend]
command=/usr/bin/npx next start -p 3000 -H 0.0.0.0
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/app/logs/frontend.log
stderr_logfile=/app/logs/frontend.err.log
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",PORT="3000",NEXT_PUBLIC_API_BASE_PATH="/api/v1"
