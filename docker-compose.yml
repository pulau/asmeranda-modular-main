name: asmeranda

# Produksi VM Kominfotik: port 80/443 tetap dikelola Nginx Proxy Manager.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,backend,web,asmeranda-backend,asmeranda-web
    container_name: asmeranda-backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      ASMERANDA_HOST: 0.0.0.0
      ASMERANDA_PORT: "8000"
      ASMERANDA_DATA_DIR: /app/data
      ASMERANDA_LOG_LEVEL: ${ASMERANDA_LOG_LEVEL:-INFO}
      ASMERANDA_DEBUG: "false"
      ASMERANDA_PRODUCTION_MODE: "true"
      ASMERANDA_MAX_UPLOAD_SIZE_MB: ${ASMERANDA_MAX_UPLOAD_SIZE_MB:-200}
      ASMERANDA_ALLOWED_HOSTS: ${ASMERANDA_ALLOWED_HOSTS:-["*"]}
      ASMERANDA_CORS_ORIGINS: ${ASMERANDA_CORS_ORIGINS:-["https://your-domain.example"]}
      ASMERANDA_JWT_SECRET: ${ASMERANDA_JWT_SECRET:?Set ASMERANDA_JWT_SECRET in .env}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,backend,web,asmeranda-backend,asmeranda-web
    volumes:
      - asmeranda_data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DOCKER_MODE: "true"
        DOCKER_API_BASE: http://backend:8000
        NEXT_PUBLIC_BASE_PATH: /asmeranda
        NEXT_PUBLIC_API_BASE_PATH: /asmeranda/api/v1
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,backend,web,asmeranda-backend,asmeranda-web
    container_name: asmeranda-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DOCKER_MODE: "true"
      DOCKER_API_BASE: http://backend:8000
      NEXT_PUBLIC_BASE_PATH: /asmeranda
      NEXT_PUBLIC_API_BASE_PATH: /asmeranda/api/v1
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy

networks:
  internal:
    external: true
    name: ${COMINFOTIK_DOCKER_NETWORK:-internal}

volumes:
  asmeranda_data:
    name: asmeranda_data
