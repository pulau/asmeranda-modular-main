services:
  # Backend FastAPI Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asmeranda-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ASMERANDA_HOST=0.0.0.0
      - ASMERANDA_PORT=8000
      - ASMERANDA_DATA_DIR=/app/data
      - ASMERANDA_LOG_LEVEL=INFO
      - ASMERANDA_MAX_UPLOAD_SIZE_MB=100
      - ASMERANDA_ALLOWED_HOSTS=["*"]
      - ASMERANDA_CORS_ORIGINS=["*"]
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    networks:
      - asmeranda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # Frontend Next.js Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - DOCKER_MODE=true
        - DOCKER_API_BASE=http://backend:8000
        - NEXT_PUBLIC_API_BASE=http://backend:8000
        - NEXT_PUBLIC_API_BASE_PATH=/api/v1
    container_name: asmeranda-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - DOCKER_API_BASE=http://backend:8000
      - NEXT_PUBLIC_API_BASE=http://backend:8000
      - NEXT_PUBLIC_API_BASE_PATH=/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - asmeranda-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: asmeranda-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - asmeranda-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

networks:
  asmeranda-network:
    driver: bridge

volumes:
  data: