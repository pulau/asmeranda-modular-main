name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'core/**'
      - 'requirements-backend.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'core/**'
      - 'requirements-backend.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
          pip install -r requirements-dev.txt
      
      - name: Lint dengan Black
        run: |
          black --check backend/ core/
      
      - name: Sort imports dengan isort
        run: |
          isort --check-only backend/ core/
      
      - name: Lint dengan flake8
        run: |
          flake8 backend/ core/ --max-line-length=100
      
      - name: Type checking dengan mypy
        run: |
          mypy backend/ core/ --ignore-missing-imports || true
      
      - name: Security check dengan bandit
        run: |
          bandit -r backend/ core/ -ll || true
      
      - name: Run unit tests
        run: |
          pytest backend/tests/unit -v --cov=backend --cov-report=xml --cov-report=term-missing
      
      - name: Run integration tests
        run: |
          pytest backend/tests/integration -v --cov=backend --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
      
      - name: Run bandit security scan
        run: |
          bandit -r backend/ core/ -ll -f json -o bandit-report.json || true
      
      - name: Check Python dependencies
        run: |
          safety check --json || true
      
      - name: Check pip packages untuk vulnerabilities
        run: |
          pip-audit || true
      
      - name: Upload bandit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: asmeranda:backend-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v3
        continue-on-error: true
      
      - name: Comment PR dengan coverage
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const coverage = "Coverage report generated - see artifacts for details";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverage
            });
