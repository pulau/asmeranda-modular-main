name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  python-security:
    runs-on: ubuntu-latest
    name: Python Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
      
      - name: Run Bandit security scan
        run: |
          bandit -r backend/ core/ -ll -f json -o bandit-report.json || true
      
      - name: Check Python dependencies vulnerability
        run: |
          safety check --json || true
      
      - name: Audit pip packages
        run: |
          pip-audit || true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Check Python requirements
        run: |
          pip install -r requirements.txt -r requirements-backend.txt -r requirements-dev.txt --dry-run || true
      
      - name: Generate Python dependencies report
        run: |
          pip freeze > python-dependencies.txt
      
      - name: Upload dependencies report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-dependencies
          path: python-dependencies.txt
          retention-days: 30

  nodejs-security:
    runs-on: ubuntu-latest
    name: Node.js Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Check npm vulnerabilities
        working-directory: frontend
        run: npm audit || true
      
      - name: Generate npm audit report
        working-directory: frontend
        run: npm audit --json > npm-audit.json || true
      
      - name: Upload npm audit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
          retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort mypy
      
      - name: Check code style
        run: |
          black --check backend/ core/ --quiet || true
          isort --check-only backend/ core/ --quiet || true
      
      - name: Lint code
        run: |
          flake8 backend/ core/ || true
          pylint backend/ core/ --fail-under=7.0 || true
      
      - name: Type checking
        run: |
          mypy backend/ core/ --ignore-missing-imports || true
      
      - name: Generate quality report
        run: |
          echo "Code quality scan completed" > quality-report.txt
      
      - name: Upload quality report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: quality-report
          path: quality-report.txt
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    needs: [python-security, dependency-check, nodejs-security, code-quality]
    if: always()
    name: Security Summary
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v3
        continue-on-error: true
      
      - name: Generate summary
        run: |
          echo "Security and quality scan completed"
          echo "Reports available in artifacts"
      
      - name: Comment on PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Security and quality scans completed. See artifacts for detailed reports.'
            })
