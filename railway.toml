# Railway Deployment Configuration
# Dokumentasi: https://docs.railway.app/reference/config-as-code
#
# Deploy backend FastAPI ke Railway:
# 1. Connect repo ke Railway: https://railway.app/new
# 2. Set environment variables di Railway dashboard (lihat .env.example)
# 3. Railway otomatis detect config ini

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
